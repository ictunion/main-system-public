[global.limits]
json = 2_097_152

[global]
# Bind to and host
address = "127.0.0.1"
host = "http://localhost:8000"
admin_host = "http://localhost:1234"

# Logging
log_level = "debug"

# Email (smtp) configuration
smtp_host = "mail.ictunion.cz"
smtp_user = "noreply@ictunion.cz"
smtp_password = ""

# Email configuration
notification_email = ""
email_sender_email = "noreply@ictunion.cz"
email_sender_name = "ICT Union"
treasurer_reply_email = "treasurer@ictunion.cz"
treasurer_reply_name = "ICT Union Treasurer"
templates_dir = "./templates/emails"

# newsletter-system base URL, e.g. "https://newsletter.example.org".
# Empty disables the calls on member changes (development).
newsletter_host = ""

# Database
postgres = "postgres://orca@localhost/ictunion"
web_db_pool = 5
processing_db_pool = 2

# PDF printing
tex_exe = "xelatex"
# Member id of the union chairperson who signs generated documents (entrustments).
# Can be set via ROCKET_UNION_CHAIRPERSON_MEMBER_ID env variable.
# union_chairperson_member_id = "00000000-0000-0000-0000-000000000000"
# Printed on the workplace announcement.
# Can be set via ROCKET_UNION_CHAIRPERSON_EMAIL env variable.
union_chairperson_email = ""
# Base64 encoded PNG of the chairperson's signature printed at the bottom of workplace documents.
# Never commit the image -- set it via ROCKET_UNION_CHAIRPERSON_SIGNATURE env variable,
# e.g. `export ROCKET_UNION_CHAIRPERSON_SIGNATURE="$(base64 -w0 signature.png)"`
# union_chairperson_signature = ""

# Authentication / Authorization
keycloak_host = "http://localhost:8180"
keycloak_realm = "members"
keycloak_client_id = "orca"
keycloak_members_group_id = "f2d3fe95-05e0-4d00-9e8c-9a189fdbf495"
# Required when Keycloak is configured. Confidential client whose service account
# has realm-management/manage-users and the kc-admin-api default client scope.
# Every Keycloak Admin API call (creating accounts, group membership, ...) is made
# with its token; Orca refuses to start without it. Set the secret via
# ROCKET_KEYCLOAK_SERVICE_CLIENT_SECRET in production.
keycloak_service_client_id = "orca-service"
keycloak_service_client_secret = "orca-service-dev-secret"

# Business logic configuration
processing_queue_size = 16

# Bank sync: shared-secret bearer token for the bank-system daily
# member sync job (GET /sync/bank/members).
bank_sync_token = ""

# Newsletter sync: shared-secret bearer token for newsletter-system's
# member sync (GET /sync/newsletter/members).
newsletter_sync_token = ""

# Confirmation api redirect urls
[global.verify_redirects_to]
default = "http://localhost:1313/en/confirmed"
cs = "http://localhost:1313/cs/schvaleno"

# Confirmation email subjects
[global.email_confirmation_subjects]
default = "Verify Email Address"
cs = "Potvrď e-mail"
